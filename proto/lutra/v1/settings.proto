syntax = "proto3";

package lutra.v1;

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service SettingsService {
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc UpsertSetting(UpsertSettingRequest) returns (UpsertSettingResponse);
  rpc DeleteSetting(DeleteSettingRequest) returns (DeleteSettingResponse);
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
}

message Namespace {
  string id = 1;
  string slug = 2;
  string name = 3;
  string created_at = 4;
}
message Setting {
  string namespace_id = 1;
  string path = 2;
  bytes value_cbor = 3;
  string updated_at = 4;
  bool sensitive = 5;
}
message CreateNamespaceRequest {
  string slug = 1;
  string name = 2;
}
message CreateNamespaceResponse {
  Namespace namespace = 1;
}
message ListNamespacesRequest {}
message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
}
message UpsertSettingRequest {
  string namespace_id = 1;
  string path = 2;
  bytes value_cbor = 3;
  bool sensitive = 4;
}
message UpsertSettingResponse {
  Setting setting = 1;
}
message DeleteSettingRequest {
  string namespace_id = 1;
  string path = 2;
}
message DeleteSettingResponse {}
message ListSettingsRequest {
  string namespace_id = 1;
  repeated string paths = 2;
}
message ListSettingsResponse {
  repeated Setting settings = 1;
}
