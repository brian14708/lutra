syntax = "proto3";

package lutra.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service LutraService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1 [(buf.validate.field).string.max_len = 1024];
}

message PingResponse {
  string message = 1;
  google.protobuf.Timestamp timestamp = 2;
}
