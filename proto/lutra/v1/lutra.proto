syntax = "proto3";

package lutra.v1;

import "lutra/v1/log.proto";

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service LutraService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc CreateTaskAction(CreateTaskActionRequest) returns (CreateTaskActionResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetTaskAction(GetTaskActionRequest) returns (GetTaskActionResponse);
  rpc ListTaskActions(ListTaskActionsRequest) returns (ListTaskActionsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
}

// SourceBundle is a blob containing the task's source archive and lockfile.
message SourceBundle {
  string uri = 1;
}

// TaskImage selects the worker environment used to execute a task.
message TaskImage {
  string name = 1;
}

// TaskSpec is an immutable version of a task.
message TaskSpec {
  string project = 1;
  string domain = 2;
  string name = 3;
  string module = 4;
  string qualname = 5;
  string version = 6;
  SourceBundle source = 7;
  TaskImage image = 8;
}

message CreateRunRequest {
  TaskSpec spec = 1;
  bytes input_cbor = 2;
  string idempotency_key = 4;
}
message CreateRunResponse {
  Run run = 1;
}
message CreateTaskActionRequest {
  TaskSpec spec = 1;
  bytes input_cbor = 2;
  string idempotency_key = 3;
}
message CreateTaskActionResponse {
  TaskAction action = 1;
}
message GetRunRequest {
  string id = 1;
  bool wait = 2;
}
message GetRunResponse {
  Run run = 1;
}
message GetTaskActionRequest {
  string id = 1;
  bool wait = 2;
}
message GetTaskActionResponse {
  TaskAction action = 1;
}
message ListTaskActionsRequest {
  string run_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListTaskActionsResponse {
  repeated TaskAction actions = 1;
  string next_page_token = 2;
}
message CancelRunRequest {
  string id = 1;
}
message CancelRunResponse {
  Run run = 1;
}
message WatchRunRequest {
  string id = 1;
  // Optional task_log cursor. Include to receive task logs and child status history.
  // Omit for root run status updates only.
  StreamCursor task_logs = 2;
}
message WatchRunResponse {
  Run run = 1;
  LogRecord log = 2;
  TaskActionStatus action_status = 3;
}

message TaskActionStatus {
  string action_id = 1;
  string caller_action_id = 2;
  string name = 3;
  string status = 4;
  int32 attempt = 5;
  string error = 6;
  string updated_at = 7;
}
message Run {
  string id = 1;
  string root_action_id = 2;
  TaskSpec spec = 3;
  string status = 4;
  bytes output_cbor = 5;
  string error = 6;
  string created_at = 7;
  string updated_at = 8;
}

message TaskAction {
  string id = 1;
  string run_id = 2;
  string caller_action_id = 3;
  TaskSpec spec = 4;
  bytes input_cbor = 5;
  bytes output_cbor = 6;
  string status = 7;
  string error = 8;
  int32 attempts = 9;
  string created_at = 10;
  string updated_at = 11;
  repeated string upstream_action_ids = 12;
}
