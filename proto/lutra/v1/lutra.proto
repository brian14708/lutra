syntax = "proto3";

package lutra.v1;

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service LutraService {
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
}

message RunTaskRequest {
  string task_name = 1;
  bytes parameters_cbor = 2;
}

message RunTaskResponse {
  string content_type = 1;
  bytes result_cbor = 2;
}
