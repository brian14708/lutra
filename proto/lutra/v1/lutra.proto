syntax = "proto3";

package lutra.v1;

import "lutra/v1/log.proto";

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service LutraService {
  rpc RegisterEnvironment(RegisterEnvironmentRequest) returns (RegisterEnvironmentResponse);
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc CreateTaskAction(CreateTaskActionRequest) returns (CreateTaskActionResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetTaskAction(GetTaskActionRequest) returns (GetTaskActionResponse);
  rpc ListTaskActions(ListTaskActionsRequest) returns (ListTaskActionsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
}

// ImageSpec declares the runtime image and its execution settings.
message ImageSpec {
  string name = 1;
  // Base image used by providers that build from another image.
  string from_image = 2;
  Resources resources = 3;
  map<string, string> env_vars = 4;
  string build_context_uri = 5;
  StartupCommand build_command = 6;
  string workdir = 7;
  // Interpreter constraint from the uv lock.
  string python_requires = 8;
}

message Resources {
  uint32 cpu_millis = 1;
  uint64 memory_bytes = 2;
}

message EnvironmentIdentifier {
  string namespace_id = 1;
  reserved 2;
  string name = 3;
  string version = 4;
}

// EnvironmentSpec declares immutable runtime inputs, excluding resolved artifacts.
// Providers consume it in two phases: building the image and starting the task,
// applying the content-addressed source bundle on top of the built image.
message EnvironmentSpec {
  string namespace_id = 1;
  reserved 2;
  string name = 3;
  string source_uri = 4;
  ImageSpec image = 5;
  repeated EnvironmentIdentifier dependencies = 6;
  // Entrypoint IDs are one-based positions in this list.
  repeated Entrypoint entrypoints = 7;
  // Relative Python import paths within the source bundle.
  repeated string import_roots = 8;
}

message Entrypoint {
  StartupCommand command = 1;
  int32 max_attempts = 3;
  bool cache = 4;
  string task_version = 5;
}

message StartupCommand {
  repeated string args = 1;
}

message ActionSpec {
  bytes input_cbor = 1;
  int32 max_attempts = 2;
  bool cache = 3;
  string task_version = 4;
}

message RegisterEnvironmentRequest {
  EnvironmentSpec spec = 1;
}
message RegisterEnvironmentResponse {
  EnvironmentIdentifier environment = 1;
}

message CreateRunRequest {
  EnvironmentIdentifier environment = 1;
  uint32 entrypoint_id = 2;
  ActionSpec action_spec = 3;
  string idempotency_key = 4;
}
message CreateRunResponse {
  Run run = 1;
}
message CreateTaskActionRequest {
  EnvironmentIdentifier environment = 1;
  uint32 entrypoint_id = 2;
  ActionSpec action_spec = 3;
  // Stable within the parent task across retries and replay.
  string idempotency_key = 4;
}
message CreateTaskActionResponse {
  TaskAction action = 1;
}
message GetRunRequest {
  string id = 1;
  bool wait = 2;
}
message GetRunResponse {
  Run run = 1;
}
message GetTaskActionRequest {
  string id = 1;
  bool wait = 2;
}
message GetTaskActionResponse {
  TaskAction action = 1;
}
message ListTaskActionsRequest {
  string run_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListTaskActionsResponse {
  repeated TaskAction actions = 1;
  string next_page_token = 2;
}
message CancelRunRequest {
  string id = 1;
}
message CancelRunResponse {
  Run run = 1;
}
message WatchRunRequest {
  string id = 1;
  // Optional task_log cursor. Include to receive task logs and child status history.
  // Omit for root run status updates only.
  StreamCursor task_logs = 2;
}
message WatchRunResponse {
  Run run = 1;
  LogRecord log = 2;
  TaskActionStatus action_status = 3;
}

message TaskActionStatus {
  string action_id = 1;
  string caller_action_id = 2;
  uint32 entrypoint_id = 3;
  string status = 4;
  int32 attempt = 5;
  string error = 6;
  string updated_at = 7;
  int32 max_attempts = 8;
  bool cache_hit = 9;
}
message Run {
  string id = 1;
  string root_action_id = 2;
  EnvironmentIdentifier environment = 3;
  string status = 4;
  bytes output_cbor = 5;
  string error = 6;
  string created_at = 7;
  string updated_at = 8;
  uint32 entrypoint_id = 9;
}

message TaskAction {
  string id = 1;
  string run_id = 2;
  string caller_action_id = 3;
  EnvironmentIdentifier environment = 4;
  ActionSpec action_spec = 5;
  bytes output_cbor = 6;
  string status = 7;
  string error = 8;
  int32 attempts = 9;
  string created_at = 10;
  string updated_at = 11;
  reserved 12;
  uint32 entrypoint_id = 13;
}
