syntax = "proto3";

package lutra.v1;

import "lutra/v1/log.proto";

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service LutraService {
  rpc RegisterEnvironment(RegisterEnvironmentRequest) returns (RegisterEnvironmentResponse);
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  // Retry direct delivery of an existing run without changing its configuration.
  rpc RetryRun(RetryRunRequest) returns (RetryRunResponse);
  rpc CreateTaskAction(CreateTaskActionRequest) returns (CreateTaskActionResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetTaskAction(GetTaskActionRequest) returns (GetTaskActionResponse);
  rpc ListTaskActions(ListTaskActionsRequest) returns (ListTaskActionsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
  rpc WorkflowTimer(WorkflowTimerRequest) returns (WorkflowTimerResponse);
  rpc WorkflowWait(WorkflowWaitRequest) returns (WorkflowWaitResponse);
  rpc WorkflowState(WorkflowStateRequest) returns (WorkflowStateResponse);
  rpc WorkflowPromise(WorkflowPromiseRequest) returns (WorkflowPromiseResponse);
  rpc WorkflowAwakeable(WorkflowAwakeableRequest) returns (WorkflowAwakeableResponse);
  rpc WorkflowEntropy(WorkflowEntropyRequest) returns (WorkflowEntropyResponse);
  rpc WorkflowCancel(WorkflowCancelRequest) returns (WorkflowCancelResponse);
  rpc WorkflowInspect(WorkflowInspectRequest) returns (WorkflowInspectResponse);
  rpc ResolveAwakeable(ResolveAwakeableRequest) returns (ResolveAwakeableResponse);
  rpc SignalRun(SignalRunRequest) returns (SignalRunResponse);
  // Task-only callback; the destination is derived from the task identity.
  rpc TaskSignalWorkflow(TaskSignalWorkflowRequest) returns (TaskSignalWorkflowResponse);
}

// ImageSpec declares the runtime image and its execution settings.
message ImageSpec {
  string name = 1;
  // Base image used by providers that build from another image.
  string from_image = 2;
  Resources resources = 3;
  map<string, EnvValue> env = 4;
  string build_context_uri = 5;
  // Linux container target (for example linux/arm64).
  string platform = 9;
  repeated OciCopy oci_copies = 10;
  repeated Command build_commands = 11;
  map<string, string> build_env = 12;
}

message OciCopy {
  string image = 1;
  string source = 2;
  string destination = 3;
}

message EnvValue {
  oneof source {
    string static_value = 1;
    string setting_ref = 2;
  }
  optional bool sensitive = 3;
}

message Resources {
  uint32 cpu_millis = 1;
  uint64 memory_bytes = 2;
}

message EnvironmentIdentifier {
  string namespace_id = 1;
  string name = 3;
  string version = 4;
}

// EnvironmentSpec declares immutable runtime inputs, excluding resolved artifacts.
// Providers consume it in two phases: building the image and starting the task,
// applying the content-addressed source bundle on top of the built image.
message EnvironmentSpec {
  string namespace_id = 1;
  string name = 3;
  string source_uri = 4;
  ImageSpec image = 5;
  repeated EnvironmentIdentifier dependencies = 6;
  Command prepare_command = 8;
  // Entrypoint IDs are one-based positions in this list.
  repeated Entrypoint entrypoints = 7;
  // Runtime paths, relative to the source bundle; never image build inputs.
  string workdir = 9;
}

message Entrypoint {
  Command command = 1;
  string name = 2;
  int32 max_attempts = 3;
  bool cache = 4;
  string task_version = 5;
  repeated ConfigBinding config = 6;
  // Replay the entrypoint from the beginning after durable waits.
  bool workflow = 7;
}

message ConfigBinding {
  string name = 1;
  string setting_ref = 2;
  optional bool required = 3;
  optional bool sensitive = 4;
}

message Command {
  repeated string args = 1;
}

message ActionSpec {
  bytes input_cbor = 1;
  int32 max_attempts = 2;
  bool cache = 3;
  string task_version = 4;
  bytes config_overrides_cbor = 5;
}

message RegisterEnvironmentRequest {
  EnvironmentSpec spec = 1;
}
message RegisterEnvironmentResponse {
  EnvironmentIdentifier environment = 1;
}

message CreateRunRequest {
  EnvironmentIdentifier environment = 1;
  uint32 entrypoint_id = 2;
  ActionSpec action_spec = 3;
  // Reuse this key when delivery fails after the run commits.
  string idempotency_key = 4;
}
message RetryRunRequest {
  string id = 1;
}
message RetryRunResponse {
  Run run = 1;
}
message CreateRunResponse {
  Run run = 1;
}
// Unavailable detail after a run commits but direct Restate delivery fails.
// Retry CreateRun using the original idempotency key, or RetryRun using this ID.
message RunDispatchFailure {
  string run_id = 1;
}
message CreateTaskActionRequest {
  EnvironmentIdentifier environment = 1;
  uint32 entrypoint_id = 2;
  ActionSpec action_spec = 3;
  // Stable within the parent task across retries and replay.
  string idempotency_key = 4;
  uint64 sequence = 5;
  optional int64 delay_millis = 6;
  // Replay-stable observability labels; not part of child execution identity.
  map<string, string> metadata = 7;
}
message CreateTaskActionResponse {
  TaskAction action = 1;
  WorkflowCommandMeta workflow_meta = 100;
}
message GetRunRequest {
  string id = 1;
  bool wait = 2;
}
message GetRunResponse {
  Run run = 1;
}
message GetTaskActionRequest {
  string id = 1;
}
message GetTaskActionResponse {
  TaskAction action = 1;
}
message ListTaskActionsRequest {
  string run_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListTaskActionsResponse {
  repeated TaskAction actions = 1;
  string next_page_token = 2;
}
message CancelRunRequest {
  string id = 1;
}
message CancelRunResponse {
  Run run = 1;
}
// Workflow operations use the authenticated task context to select the action.
message WorkflowCommandMeta {
  uint64 delivery = 1;
  string error_code = 2;
  string error_message = 3;
}
message WorkflowFuture {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CHILD = 1;
    KIND_PROMISE = 2;
    KIND_TIMER = 3;
    KIND_AWAKEABLE = 4;
  }
  Kind kind = 1;
  string key = 2;
  string id = 3;
}
message WorkflowCompletion {
  enum Failure {
    FAILURE_UNSPECIFIED = 0;
    FAILURE_REJECTED = 1;
    FAILURE_CANCELED = 2;
    FAILURE_TIMEOUT = 3;
    FAILURE_CHILD = 4;
  }
  WorkflowFuture future = 1;
  bytes value_cbor = 2;
  Failure failure = 3;
  string message = 4;
}
message WorkflowTimerRequest {
  uint64 sequence = 1;
  string key = 2;
  int64 duration_millis = 3;
}
message WorkflowTimerResponse {
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowWaitRequest {
  uint64 sequence = 1;
  repeated WorkflowFuture futures = 2;
  bool all = 3;
}
message WorkflowWaitResponse {
  repeated WorkflowCompletion completions = 1;
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowStateRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_GET = 1;
    OPERATION_SET = 2;
    OPERATION_CLEAR = 3;
    OPERATION_KEYS = 4;
  }
  uint64 sequence = 1;
  Operation operation = 2;
  string key = 3;
  bytes value_cbor = 4;
}
message WorkflowStateResponse {
  bool found = 1;
  bytes value_cbor = 2;
  repeated string keys = 3;
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowPromiseRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_PEEK = 1;
    OPERATION_RESOLVE = 2;
    OPERATION_REJECT = 3;
  }
  uint64 sequence = 1;
  Operation operation = 2;
  string name = 3;
  bytes value_cbor = 4;
  string reason = 5;
}
message WorkflowPromiseResponse {
  bool completed = 1;
  bytes value_cbor = 2;
  bool rejected = 3;
  string reason = 4;
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowAwakeableRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_CREATE = 1;
    OPERATION_RESOLVE = 2;
    OPERATION_REJECT = 3;
  }
  uint64 sequence = 1;
  Operation operation = 2;
  string key = 3;
  string id = 4;
  bytes value_cbor = 5;
  string reason = 6;
}
message WorkflowAwakeableResponse {
  string id = 1;
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowEntropyRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TIME = 1;
    KIND_SEED = 2;
    KIND_UUID_SEED = 3;
  }
  uint64 sequence = 1;
  Kind kind = 2;
}
message WorkflowEntropyResponse {
  int64 time_millis = 1;
  bytes seed = 2;
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowCancelRequest {
  uint64 sequence = 1;
  string id = 2;
}
message WorkflowCancelResponse {
  WorkflowCommandMeta workflow_meta = 100;
}
message WorkflowInspectRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_STATE_GET = 1;
    OPERATION_STATE_KEYS = 2;
    OPERATION_PROMISE_PEEK = 3;
    OPERATION_PROMISE_RESOLVE = 4;
    OPERATION_PROMISE_REJECT = 5;
  }
  string run_id = 1;
  Operation operation = 2;
  string key = 3;
  bytes value_cbor = 4;
  string reason = 5;
}
message WorkflowInspectResponse {
  bool found = 1;
  bytes value_cbor = 2;
  repeated string keys = 3;
  bool completed = 4;
  bool rejected = 5;
  string reason = 6;
  WorkflowCommandMeta workflow_meta = 100;
}
message ResolveAwakeableRequest {
  string id = 1;
  bytes value_cbor = 2;
  string reason = 3;
  bool reject = 4;
}
message ResolveAwakeableResponse {}
// Signals are one-shot named values on the root workflow of a run.
message SignalRunRequest {
  string id = 1;
  string name = 2;
  bytes value_cbor = 3;
  string idempotency_key = 4;
}
message SignalRunResponse {}

message TaskSignalWorkflowRequest {
  string name = 1;
  bytes value_cbor = 2;
}

message TaskSignalWorkflowResponse {}
message WatchRunRequest {
  string id = 1;
  // Optional task_log or agent cursor. Include to receive logs and child status history.
  // Omit for root run status updates only.
  StreamCursor task_logs = 2;
}
message WatchRunResponse {
  Run run = 1;
  LogRecord log = 2;
  TaskActionStatus action_status = 3;
}

message TaskActionStatus {
  string action_id = 1;
  string caller_action_id = 2;
  uint32 entrypoint_id = 3;
  string status = 4;
  int32 attempt = 5;
  bytes result_cbor = 6;
  string updated_at = 7;
  int32 max_attempts = 8;
  bool cache_hit = 9;
  // Registered name, disambiguating entrypoint IDs across environments.
  string entrypoint_name = 10;
}
message Run {
  string id = 1;
  string root_action_id = 2;
  EnvironmentIdentifier environment = 3;
  string status = 4;
  bytes result_cbor = 5;
  string created_at = 7;
  string updated_at = 8;
  uint32 entrypoint_id = 9;
}

message TaskAction {
  string id = 1;
  string run_id = 2;
  string caller_action_id = 3;
  EnvironmentIdentifier environment = 4;
  ActionSpec action_spec = 5;
  bytes result_cbor = 6;
  string status = 7;
  int32 attempts = 9;
  string created_at = 10;
  string updated_at = 11;
  uint32 entrypoint_id = 13;
}
