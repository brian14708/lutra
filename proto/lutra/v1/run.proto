syntax = "proto3";

package lutra.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/brian14708/lutra/gen/lutra/v1;lutrav1";

service RunService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetAction(GetActionRequest) returns (GetActionResponse);
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCEEDED = 3;
  RUN_STATE_FAILED = 4;
  RUN_STATE_CANCELLED = 5;
}

enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  ACTION_STATE_READY = 1;
  ACTION_STATE_RUNNING = 2;
  ACTION_STATE_SUCCEEDED = 3;
  ACTION_STATE_FAILED = 4;
  ACTION_STATE_CANCELED = 5;
  ACTION_STATE_TIMED_OUT = 6;
}

enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_OPEN = 1;
  ATTEMPT_STATE_SUCCEEDED = 2;
  ATTEMPT_STATE_FAILED = 3;
  ATTEMPT_STATE_CANCELED = 4;
  ATTEMPT_STATE_LOST = 5;
}

message ActionStatus {
  ActionState state = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  uint32 attempt_count = 4;
  uint64 duration_ms = 5;
  string failure_message = 6;
}

message ActionAttempt {
  uint32 attempt = 1 [(buf.validate.field).uint32.gt = 0];
  AttemptState state = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  string failure_message = 5 [(buf.validate.field).string.max_len = 4096];
}

message Action {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string run_id = 2 [(buf.validate.field).string.uuid = true];
  string action_id = 3 [(buf.validate.field).string.uuid = true];
  // Empty for the run's root action.
  optional string parent_action_id = 4 [(buf.validate.field).string.uuid = true];
  string task_id = 6 [(buf.validate.field).string.uuid = true];
  ActionStatus status = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  repeated ActionAttempt attempts = 10;
  repeated InputBinding inputs = 11;
  repeated InputBinding outputs = 12;
  // Stable logical invocation identity for a dynamically created child.
  string operation_id = 13;
}

message Run {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string run_id = 2 [(buf.validate.field).string.uuid = true];
  // Derived from the run's root action.
  string root_task_id = 3 [(buf.validate.field).string.uuid = true];
  Action root_action = 4;
  RunState state = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}

message InputBinding {
  string slot_name = 1 [(buf.validate.field).string.min_len = 1];
  oneof value {
    option (buf.validate.oneof).required = true;
    bytes inline_bytes = 2;
    string artifact_id = 3 [(buf.validate.field).string.uuid = true];
  }
}

message CreateRunRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  repeated InputBinding inputs = 3;
  // Optional client key used to make submission retries idempotent.
  string idempotency_key = 4 [(buf.validate.field).string.max_len = 256];
}

message CreateRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string run_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetRunResponse {
  Run run = 1;
}

message GetActionRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string run_id = 2 [(buf.validate.field).string.uuid = true];
  string action_id = 3 [(buf.validate.field).string.uuid = true];
}

message GetActionResponse {
  Action action = 1;
}

message ListActionsRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string run_id = 2 [(buf.validate.field).string.uuid = true];
}

message ListActionsResponse {
  repeated Action actions = 1;
}

message CancelRunRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string run_id = 2 [(buf.validate.field).string.uuid = true];
}

message CancelRunResponse {
  Run run = 1;
}
