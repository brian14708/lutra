syntax = "proto3";

package lutra.task.v1;

option go_package = "github.com/brian14708/lutra/gen/lutra/task/v1;taskv1";

// TaskService runs inside a task host subprocess speaking a multiplexed NDJSON
// protocol over stdio (implemented by internal/taskstdio in Go and
// lutra.task_host in Python). Frame IDs are namespaced by initiator: the Go
// side uses "g<N>" for its calls, the task host uses "p<N>" for reverse calls
// back into Go.
service TaskService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message ExecuteRequest {
  string invocation_id = 1;
  string content_type = 2;
  bytes input = 3;
}

message ExecuteResponse {
  string content_type = 1;
  bytes output = 2;
}
