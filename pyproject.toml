[tool.uv.workspace]
members = ["sdk"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["integration: requires a running Lutra stack"]
testpaths = ["sdk/tests"]
pythonpath = ["sdk/src", "sdk/examples"]

[dependency-groups]
dev = [
  "protoc-gen-connectrpc>=0.12.1",
  "protoc-gen-py>=0.4.0",
  "pyrefly>=0.43.0",
  "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
preview = true
extend-exclude = ["sdk/src/lutra/_gen"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The formatter owns trailing commas.
  "missing-trailing-comma",
  # Avoid conflicts with the selected first-line, no-blank-line docstring style.
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "missing-copyright-notice",
]
extend-safe-fixes = ["TC", "unused-import"]

[tool.ruff.lint.per-file-ignores]
"sdk/tests/**/*.py" = [
  "assert",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-public-init",
  "import-private-name",
  "magic-value-comparison",
]
"sdk/examples/**/*.py" = [
  "undocumented-public-class",
  "undocumented-public-function",
  "print",
  "implicit-namespace-package",
]
# AgentSession shares Agent configuration and narrows state after lifecycle guards.
"sdk/src/lutra/agent.py" = ["private-member-access", "assert"]

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["typing_extensions.TypedDict"]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict" = { msg = "Use typing_extensions.TypedDict instead." }
"typing_extensions.AsyncContextManager" = { msg = "Use contextlib.AbstractAsyncContextManager instead." }
"typing_extensions.AsyncGenerator" = { msg = "Use collections.abc.AsyncGenerator instead." }

[tool.ruff.format]
preview = true
docstring-code-format = true
skip-magic-trailing-comma = true
