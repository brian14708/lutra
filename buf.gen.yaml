version: v2

clean: true
inputs:
  - directory: proto
managed:
  enabled: true
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt:
      - paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt:
      - paths=source_relative
  - local: [uv, run, protoc-gen-py]
    out: sdk/src/lutra/_gen
    include_imports: true
    opt:
      - init_files=true
  - local: [uv, run, protoc-gen-connectrpc]
    out: sdk/src/lutra/_gen
    opt:
      - io=async
  - local: [pnpm, exec, protoc-gen-es]
    out: ui/src/proto
    include_imports: true
    opt:
      - target=ts
  - local: [pnpm, exec, protoc-gen-connect-query]
    out: ui/src/proto
    opt:
      - target=ts
