[project]
name = "lutra"
version = "0.1.0"
description = "Python client SDK for the Lutra API."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lutra contributors" }]
dependencies = [
    "connectrpc>=0.12.0,<0.13.0",
    "cbor2>=5.7,<6",
    "httpx>=0.28,<1",
    "pathspec>=1.1,<2",
    "zstandard>=0.25,<1",
]

[project.optional-dependencies]
tui = ["rich>=13.7,<15"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.build.targets.sdist.force-include]
"src/lutra/_gen" = "src/lutra/_gen"

[tool.hatch.build.targets.wheel]
packages = ["src/lutra"]

[tool.pytest.ini_options]
addopts = ["-ra"]
asyncio_mode = "auto"
markers = ["integration: requires a running Lutra stack"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["src/lutra/_gen"]
python-version = "3.11"
search-path = ["src"]
preset = "strict"
